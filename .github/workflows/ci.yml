name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 3.11 is the version that matters: it is what Anaconda 2023.07-2 ships,
  # which is the target. 3.12 and 3.13 are there to catch forward-compat
  # breakage early, and the code stays 3.10-clean so nobody on an older
  # Anaconda is stranded.
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The claim "net new installs: none" is only true if something enforces it.
  # This job installs the package with NO dependency resolution at all and
  # runs the suite against what Anaconda already ships.
  anaconda:
    name: anaconda 2023.07-2 (no pip installs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          auto-activate-base: true
          activate-environment: ""
      - name: Everything formgen needs is already here
        shell: pwsh
        run: |
          conda install -y --quiet lxml markdown-it-py pyyaml click `
            python-dateutil pillow pywin32 pytest
          python -c "import importlib.util as u, sys; missing=[m for m in ['lxml','markdown_it','yaml','click','dateutil','PIL','pytest'] if not u.find_spec(m)]; sys.exit('missing: '+', '.join(missing) if missing else 0)"
      - name: Install formgen itself, and nothing else
        shell: pwsh
        run: pip install --no-deps --no-build-isolation -e .
      - shell: pwsh
        run: pytest -q

  # LibreOffice is not Word, and a clean conversion says nothing about how a
  # document looks. It does say, reliably, that the package is not corrupt --
  # the one thing a test written against our own reader cannot tell us,
  # because our reader would have to be wrong in the same way twice.
  render:
    name: LibreOffice renders what we write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_smoke.py -rs
        env:
          FORMGEN_SOFFICE_TIMEOUT: "300"

  # The template-to-document path is the half people want in a browser. The
  # alternative to this job is a second implementation in JavaScript, which
  # would have to re-derive the OPC preservation guarantee, the content
  # control handling and the deterministic zip -- and would then drift from
  # the Python one in ways nobody notices until a document is wrong. So the
  # same source runs under Pyodide and the output is compared byte for byte.
  wasm:
    name: the same source runs in WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - run: npm install
        working-directory: tools/wasm
      - run: node check.mjs
        working-directory: tools/wasm
      # The single-file distributable embeds the same source; build it and
      # prove it runs in the browser and produces the same bytes as CPython.
      - run: python tools/build_single_html.py
      - run: node check_single.mjs
        working-directory: tools/wasm

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests tools

  # Every merge to main is a release. The version is the last v* tag with its
  # patch bumped -- monotonic, no commit written back, so it never loops. The
  # one artifact is the offline single-file build: open it in a browser and it
  # needs nothing else, which is the whole point of shipping it this way.
  publish:
    name: release the single file
    needs: [test, wasm, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags, to work out the next version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: tools/wasm
      - name: Work out the next version
        id: ver
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="0.1.1"
          else
            v=${latest#v}; IFS=. read -r a b c <<< "$v"; next="$a.$b.$((c + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next"
      - name: Build the single file
        run: |
          python tools/build_single_html.py dist/formgen.html
          cp dist/formgen.html "formgen-v${{ steps.ver.outputs.version }}.html"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "formgen-v${{ steps.ver.outputs.version }}.html" \
            --target "${{ github.sha }}" \
            --title "formgen ${{ steps.ver.outputs.tag }}" \
            --notes "Offline, self-contained build. Download the .html and open it in any browser -- no install, no network, and the documents you fill never leave your machine. Built from ${{ github.sha }}."

  # Also publish the single file as the live site, so there is a URL people can
  # just open. It runs entirely in the visitor's browser, so nothing they do
  # reaches the server.
  pages:
    name: publish the live app
    needs: [test, wasm, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: tools/wasm
      - run: python tools/build_single_html.py public/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
