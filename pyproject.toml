[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "formgen"
version = "0.1.0"
description = "Learn a .docx house format from examples, then generate, check, and repair against it"
requires-python = ">=3.10"
dependencies = [
    "lxml",
    "click",
    "PyYAML",
    "markdown-it-py",
    "python-dateutil",
    "Pillow",
]

[project.optional-dependencies]
# Word COM: doctor, --refresh, --pdf. Ships with Anaconda on Windows and is
# imported lazily inside word/com.py, so nothing breaks without it.
word = ["pywin32; sys_platform == 'win32'"]
dev = ["pytest", "ruff"]

# Deliberately absent: scikit-learn (the corpus clustering is an exhaustive
# two-medoid search -- deterministic, and about forty lines) and
# mdit-py-plugins (our dialect needs custom extensions regardless, so the
# four we use are ours). Every import in src/ resolves against a stock
# Anaconda 2023.07-2. Net new installs: none, and CI enforces it.

[project.scripts]
formgen = "formgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
