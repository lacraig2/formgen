[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "formgen"
version = "0.1.0"
description = "Learn a .docx house format from examples, then generate, check, and repair against it"
requires-python = ">=3.10"
dependencies = [
    "lxml",
    "click",
    "PyYAML",
    "markdown-it-py",
    "python-dateutil",
    "Pillow",
]

[project.optional-dependencies]
learn = ["scikit-learn"]   # Phase 5 corpus clustering only
word = ["pywin32; sys_platform == 'win32'"]
dev = ["pytest", "hypothesis"]

[project.scripts]
formgen = "formgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
