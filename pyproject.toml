[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "formgen"
version = "0.1.0"
description = "Learn a .docx house format from examples, then generate, check, and repair against it"
requires-python = ">=3.10"
dependencies = [
    "lxml",
    "click",
    "PyYAML",
    "markdown-it-py",
    "python-dateutil",
]

[project.optional-dependencies]
# Word COM: doctor, --refresh, --pdf. Ships with Anaconda on Windows and is
# imported lazily inside word/com.py, so nothing breaks without it.
word = ["pywin32; sys_platform == 'win32'"]
# Pillow is a test-only dependency: it writes the image fixtures and is the
# oracle test_imageinfo.py checks our own header reader against. Nothing under
# src/ imports it -- emit.py used to, for image sizing alone, but that is now
# content/imageinfo.py, so the browser bundle no longer downloads the wheel.
dev = ["pytest", "ruff", "Pillow"]

# Deliberately absent: scikit-learn (the corpus clustering is an exhaustive
# two-medoid search -- deterministic, and about forty lines) and
# mdit-py-plugins (our dialect needs custom extensions regardless, so the
# four we use are ours). Every import in src/ resolves against a stock
# Anaconda 2023.07-2. Net new installs: none, and CI enforces it.

[project.scripts]
formgen = "formgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

# Pin the rule set so a newer ruff on CI does not start failing on rules the
# codebase never opted into. These are ruff's own classic defaults made
# explicit (pyflakes plus the pycodestyle error subset).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
